<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dungeon Card Crawler</title>
    <meta name="theme-color" content="#090a0c">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --bg-color: #090a0c;
            --card-bg: #15171e;
            --card-border: #2d313d;
        }
        body {
            margin: 0;
            background-color: var(--bg-color);
            color: #e5e7eb;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #game-container {
            position: relative;
            display: flex;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #version {
            position: fixed;
            bottom: 5px;
            right: 5px;
            color: #6b7280;
            font-size: 10px;
            z-index: 100;
            pointer-events: none;
        }
        #game-container.damage-flash {
            animation: damageFlash 0.3s ease-out;
        }
        @keyframes damageFlash {
            0%, 100% { background-color: var(--bg-color); }
            50% { background-color: rgba(239, 68, 68, 0.5); }
        }
        canvas {
            display: block;
            background: var(--bg-color);
        }
        .log-box {
            text-align: center;
            pointer-events: none;
            color: #94a3b8;
            font-size: 0.8rem;
            text-transform: uppercase;
            z-index: 20;
        }
        #inventory-display {
            display: flex;
            gap: 10px;
            z-index: 20;
            align-items: flex-end; /* Align the slots to the bottom */
            padding: 0 10px; /* Side padding */
            margin-bottom: 10px; /* Small offset from the bottom edge */
        }
        .inventory-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .inventory-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .inventory-label {
            font-size: 0.65rem;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
        }
        .inventory-slot {
            width: 50px;
            height: 50px;
            border: 2px solid #374151;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 900;
            color: #4b5563;
            transition: all 0.2s;
        }
        .inventory-slot.filled.attack {
            background-color: #f59e0b;
            border-color: #fcd34d;
            color: white;
        }
        .inventory-slot.filled.defense {
            background-color: #3b82f6;
            border-color: #60a5fa;
            color: white;
        }
        .weapon-slot {
            width: 64px; height: 64px;
            cursor: pointer;
            background-color: #1f2937;
            border: 2px solid #4b5563;
            flex-direction: column; /* Stack damage and bolts vertically */
            justify-content: center; /* Center alignment */
            gap: 2px; /* Small gap between the texts */
            padding: 4px 0; /* Vertical padding */
        }
        .weapon-slot > div {
            pointer-events: none; /* Make the text "transparent" to clicks */
        }
        .progress-box {
            pointer-events: none;
            color: #94a3b8;
            font-size: 1rem;
            font-weight: 700;
        }
        #level-buttons-container {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            width: 80%;
            max-width: 320px;
            max-height: 100%;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(9, 10, 12, 0.75);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #e5e7eb;
            text-align: center;
        }
        .overlay.level-select {
            background-color: rgba(9, 10, 12, 1);
        }
        .overlay.death-screen {
            justify-content: space-between;
            padding: 15vh 20px 5vh 20px;
        }
        .overlay-content {
            flex: 0;
        }
        .overlay-buttons {
            flex: 0;
        }
        .overlay h2 { font-size: 2rem; font-weight: 900; margin-bottom: 1rem; }
        .overlay p { color: #94a3b8; margin-bottom: 2rem; }
        .overlay .button { background-color: #1f2937; border: 1px solid #374151; padding: 0.75rem 1.5rem; border-radius: 0.5rem; cursor: pointer; margin: 0.5rem; transition: background-color 0.2s; }
        .overlay .button:hover { background-color: #374151; }
        .overlay .button.primary { background-color: #166534; border-color: #16a34a; color: white;}
        .overlay .button:disabled { background-color: #111827; border-color: #1f2937; color: #4b5563; cursor: not-allowed; }

        /* Upgrade screen: a scrollable grid of cards pinned between a gold
           header and the enter button. */
        .overlay.upgrade-screen {
            background-color: rgba(9, 10, 12, 1);
            justify-content: flex-start;
            padding: 3vh 16px 2vh 16px;
        }
        .upgrade-header {
            flex: 0 0 auto;
            width: 100%;
            max-width: 640px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 2vh;
        }
        .upgrade-header h2 { margin-bottom: 0; font-size: 1.4rem; }
        .upgrade-gold { color: #FFE761; font-weight: 900; font-size: 1.1rem; white-space: nowrap; }
        .upgrade-grid {
            flex: 1 1 auto;
            width: 100%;
            max-width: 640px;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            text-align: left;
        }
        .upgrade-card {
            background-color: #15171e;
            border: 1px solid #2d313d;
            border-radius: 0.5rem;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .upgrade-card.unaffordable { opacity: 0.55; }
        .upgrade-card-name {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #94a3b8;
        }
        .upgrade-card-value { font-size: 1.05rem; font-weight: 900; color: #e5e7eb; }
        .upgrade-card-value .next { color: #16a34a; }
        .upgrade-card-level { font-size: 0.65rem; color: #6b7280; }
        .upgrade-card-buy {
            margin: 2px 0 0 0;
            padding: 0.35rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 800;
            background-color: #166534;
            border: 1px solid #16a34a;
            color: white;
            border-radius: 0.35rem;
            cursor: pointer;
        }
        .upgrade-card-buy:disabled { background-color: #111827; border-color: #1f2937; color: #4b5563; cursor: not-allowed; }
        .upgrade-footer { flex: 0 0 auto; margin-top: 2vh; }
        .upgrade-footer .button { margin: 0; }

        /* Level select states: only the current dungeon is playable. */
        .level-btn.locked {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #1f2937;
        }
        .level-btn.current {
            border-color: #16a34a;
            color: #86efac;
            box-shadow: 0 0 0 1px #16a34a;
        }
        .level-btn .level-tag { font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; color: #6b7280; }
        .level-btn.current .level-tag { color: #16a34a; }
        .link-button {
            background: none;
            border: none;
            color: #6b7280;
            font-size: 0.8rem;
            text-decoration: underline;
            cursor: pointer;
            padding: 0.5rem;
        }
        .link-button:hover { color: #e5e7eb; }
        .ui-button {
            background-color: rgba(31, 41, 55, 0.7);
            border: 1px solid #374151;
            color: #94a3b8;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        #boss-inventory-display {
            position: absolute;
            top: 100px; /* Offset from the top */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 20;
            align-items: flex-start; /* Align to the top */
            padding: 0 10px;
        }
        .ui-button:hover { background-color: #374151; color: white; }

        #top-ui-bar {
            width: 100%;
            box-sizing: border-box;
            z-index: 10;
            position: relative;
        }
        #bottom-ui-bar { 
            width: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 10;
        }
        #gold-counter {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(31, 41, 55, 0.9);
            border-radius: 0.5rem;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            font-weight: 700;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            pointer-events: none;
        }
        #gold-counter {
            border: 2px solid var(--gold-color);
            color: var(--gold-color);
        }
    </style>
    <style>
        /* Admin styles */
        #admin-btn { position: absolute; top: 65px; left: 20px; z-index: 35; background-color: rgba(31, 41, 55, 0.7); border: 1px solid #374151; color: #94a3b8; padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
        #editor-level-list { display: flex; flex-direction: column-reverse; }
        #admin-btn:hover { background-color: #374151; color: white; }
        .editor-level-item { display: flex; align-items: center; justify-content: space-between; background-color: #1f2937; border: 1px solid #374151; padding: 0.75rem 1.5rem; border-radius: 0.5rem; margin-bottom: 0.5rem; width: 100%; }
        .editor-level-item.dragging { opacity: 0.5; background-color: #374151; }
        .drag-handle { cursor: grab; font-size: 1.5rem; color: #6b7280; margin-right: 1rem; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; text-align: left; width: 100%; max-width: 400px; }
        .form-grid label { color: #94a3b8; font-size: 0.8rem; }
        .form-grid input { background-color: #1f2937; border: 1px solid #374151; border-radius: 0.25rem; padding: 0.5rem; width: 100%; }
        .full-width { grid-column: 1 / -1; }
        .lock-toggle-btn, .delete-level-btn, .edit-level-btn { background: none; border: none; cursor: pointer; color: #6b7280; transition: color 0.2s; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; }
        .lock-toggle-btn:hover { color: #9ca3af; }
        .lock-toggle-btn { font-size: 1.2rem; }
        .delete-level-btn:hover { color: #ef4444; }
        .delete-level-btn { font-size: 1.2rem; }
        .edit-level-btn:hover { color: #60a5fa; }
        .edit-level-btn { font-size: 1.2rem; }
    </style>
</head>
<body>

    <div id="top-ui-bar"></div>
    <div id="gold-counter">💰 <span id="gold-amount">0</span></div>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>
    <div id="bottom-ui-bar">
        <div id="inventory-display"></div>
    </div>
    
    <div id="version">v26</div>

    <div id="level-select-screen" class="overlay level-select" style="display: none;">
        <h2 id="level-select-title" style="cursor: pointer; user-select: none;">SELECT DUNGEON</h2>
        <div id="level-buttons-container"></div>
    </div>

    <div id="victory-screen" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2 id="victory-title">DUNGEON COMPLETED</h2>
            <p id="victory-message">You reached the end. Well fought!</p>
            <p id="victory-gold"></p>
        </div>
        <div>
            <button id="victory-continue-btn" class="button primary">CONTINUE</button>
        </div>
    </div>

    <div id="upgrade-screen" class="overlay upgrade-screen" style="display: none;">
        <div class="upgrade-header">
            <h2 id="upgrade-title">SPEND YOUR GOLD</h2>
            <span class="upgrade-gold" id="upgrade-gold">0 GOLD</span>
        </div>
        <div class="upgrade-grid" id="upgrade-grid"></div>
        <div class="upgrade-footer">
            <button id="upgrade-enter-btn" class="button primary w-full">ENTER DUNGEON</button>
        </div>
    </div>

    <div id="game-over-screen" class="overlay death-screen" style="display: none; opacity: 0; transition: opacity 0.5s ease-in;">
        <div class="overlay-content">
            <h2 id="game-over-title">DUNGEON</h2>
            <p id="game-over-message">You are dead.</p>
        </div>
        <div class="overlay-buttons flex flex-col gap-2 w-full max-w-sm">
            <button id="restart-level-btn" class="button primary w-full">TRY AGAIN</button>
            <button id="game-over-upgrade-btn" class="button w-full">SPEND GOLD</button>
            <button id="game-over-exit-btn" class="link-button">EXIT TO DUNGEON SELECT</button>
        </div>
    </div>

    <div id="level-editor-screen" class="overlay" style="display: none;">
        <h2>LEVEL EDITOR</h2>
        <div id="editor-level-list" class="w-full max-w-md my-4"></div>
        <div>
            <button id="create-new-level-btn" class="button primary">CREATE DUNGEON</button>
            <button class="button" onclick="window.location.href='index.html'">BACK</button>
        </div>
    </div>

    <div id="create-level-screen" class="overlay" style="display: none;">
        <h2 id="create-level-title">CREATE DUNGEON</h2>
        <div class="form-grid">
            <div class="full-width">
                <label for="level-name">Dungeon name</label>
                <input type="text" id="level-name">
            </div>
            <div>
                <label for="level-rows">Length (rows)</label>
                <input type="number" id="level-rows" min="3" max="100">
            </div>
            <div>
                <label for="level-boss-hp">Elder HP multiplier (of player HP)</label>
                <input type="number" id="level-boss-hp" min="0.1" step="0.1">
            </div>
            <h3 class="full-width text-lg font-bold mt-4">Object spawn chances (%)</h3>
            <!-- The chance fields are injected dynamically -->
        </div>
        <div>
            <button id="save-level-btn" class="button primary">SAVE</button>
            <button id="cancel-create-level-btn" class="button">CANCEL</button>
        </div>
    </div>

    <script type="module" src="main.js?v=26"></script>
    <script type="module">
      // Take the gold colour from registry.js
      import { CELL_DEFS, OBJECT_TYPES } from './registry.js';
      document.documentElement.style.setProperty('--gold-color', CELL_DEFS[OBJECT_TYPES.GOLD].color);
    </script>
    <script>
      // Hidden entry into the admin: 5 clicks on the heading
      let clickCount = 0;
      let clickTimer = null;
      
      document.addEventListener('DOMContentLoaded', () => {
        const title = document.getElementById('level-select-title');
        if (title) {
          title.addEventListener('click', () => {
            clickCount++;
            
            // Reset the counter after 1 second
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => {
              clickCount = 0;
            }, 1000);
            
            // Open the admin on 5 clicks
            if (clickCount === 5) {
              window.location.href = 'admin.html';
            }
          });
        }
      });
    </script>
</body>
</html>
